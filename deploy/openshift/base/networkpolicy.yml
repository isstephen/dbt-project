apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dbt-demo-egress
  labels:
    app.kubernetes.io/name: dbt-demo
    app.kubernetes.io/part-of: analytics-platform
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: dbt-demo
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 10.0.0.0/8
        - ipBlock:
            cidr: 172.16.0.0/12
        - ipBlock:
            cidr: 192.168.0.0/16
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

apiVersion: batch/v1
kind: CronJob
metadata:
  name: dbt-demo
  labels:
    app.kubernetes.io/name: dbt-demo
    app.kubernetes.io/component: batch
    app.kubernetes.io/part-of: analytics-platform
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 3
  startingDeadlineSeconds: 1800
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dbt-demo
            app.kubernetes.io/component: batch
            app.kubernetes.io/part-of: analytics-platform
        spec:
          serviceAccountName: dbt-demo
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dbt
              image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/dbt-demo:dev
              imagePullPolicy: IfNotPresent
              envFrom:
                - secretRef:
                    name: dbt-demo-redshift
              env:
                - name: DBT_PROFILES_DIR
                  value: /app/dbt
                - name: DBT_PROJECT_DIR
                  value: /app/dbt
                - name: DBT_TARGET_PATH
                  value: /tmp/dbt-target
                - name: DBT_LOG_PATH
                  value: /tmp/dbt-logs
              resources:
                requests:
                  cpu: 250m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
              volumeMounts:
                - name: dbt-tmp
                  mountPath: /tmp
          volumes:
            - name: dbt-tmp
              emptyDir:
                sizeLimit: 1Gi

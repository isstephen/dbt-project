name: Build dbt image and push to ECR

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to push. Defaults to the commit SHA.
        required: false
        type: string
      deploy_openshift:
        description: Deploy the pushed image to OpenShift.
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'dbt-demo' }}
  OPENSHIFT_NAMESPACE: ${{ vars.OPENSHIFT_NAMESPACE || 'analytics-dbt' }}

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ inputs.image_tag }}" ]]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        shell: bash
        run: |
          aws ecr describe-repositories \
            --repository-names "${ECR_REPOSITORY}" >/dev/null 2>&1 \
            || aws ecr create-repository \
              --repository-name "${ECR_REPOSITORY}" \
              --image-scanning-configuration scanOnPush=true \
              --encryption-configuration encryptionType=AES256 >/dev/null

      - name: Build and push image
        id: image
        shell: bash
        run: |
          IMAGE_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${{ steps.tag.outputs.value }}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

  deploy-openshift:
    name: Deploy to OpenShift
    needs: build-and-push
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_openshift }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to OpenShift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER_URL }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          namespace: ${{ env.OPENSHIFT_NAMESPACE }}
          insecure_skip_tls_verify: ${{ vars.OPENSHIFT_INSECURE_SKIP_TLS_VERIFY || 'false' }}

      - name: Apply manifests and update image
        shell: bash
        run: |
          oc -n "${OPENSHIFT_NAMESPACE}" apply -k deploy/openshift/base
          oc -n "${OPENSHIFT_NAMESPACE}" set image cronjob/dbt-demo dbt="${{ needs.build-and-push.outputs.image_uri }}"

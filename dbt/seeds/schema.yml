version: 2

seeds:
  - name: raw_orders
    description: Demo raw order records loaded into Redshift by dbt seed.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_total
        tests:
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              values: ["pending", "paid", "shipped", "cancelled", "refunded"]

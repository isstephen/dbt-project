version: 2

models:
  - name: stg_orders
    description: Cleaned order records from the raw source system.
    columns:
      - name: order_id
        tests:
          - not_null
          - unique
      - name: customer_id
        tests:
          - not_null
      - name: order_total
        tests:
          - not_null
      - name: order_status
        tests:
          - accepted_values:
              values: ["pending", "paid", "shipped", "cancelled", "refunded"]

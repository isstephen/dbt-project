name: dbt_demo
version: "1.0.0"
config-version: 2

profile: dbt_demo

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "{{ env_var('DBT_TARGET_PATH', 'target') }}"
clean-targets:
  - "{{ env_var('DBT_TARGET_PATH', 'target') }}"
  - dbt_packages

models:
  dbt_demo:
    staging:
      +materialized: view
    marts:
      +materialized: table
